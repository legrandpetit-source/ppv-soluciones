<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- WiFi Waves Arc -->
  <path d="M190 85 A 75 75 0 0 1 310 85" fill="none" stroke="#00f3ff" stroke-width="8" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <path d="M205 105 A 55 55 0 0 1 295 105" fill="none" stroke="#00f3ff" stroke-width="8" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <path d="M222 125 A 35 35 0 0 1 278 125" fill="none" stroke="#00f3ff" stroke-width="8" stroke-linecap="round" filter="url(#glow-cyan)"/>

  <!-- Top Icon: P & V Vector -->
  <!-- Stylized P -->
  <path d="M 160 250 L 160 150 C 205 150, 205 200, 160 200 L 210 200" fill="none" stroke="#00f3ff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <!-- Stylized V with Growth Arrow -->
  <path d="M 245 150 L 275 250 L 320 150" fill="none" stroke="#00f3ff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <path d="M 275 220 L 275 160 M 265 170 L 275 160 L 285 170" fill="none" stroke="#00f3ff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-cyan)"/>

  <!-- PPV Main Text -->
  <text x="250" y="340" text-anchor="middle" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="92" font-weight="800" fill="none" stroke="#00f3ff" stroke-width="6" letter-spacing="12" filter="url(#glow-cyan)">PPV</text>

  <!-- SOLUCIONES Subtitle Text -->
  <text x="250" y="415" text-anchor="middle" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="44" font-weight="800" fill="none" stroke="#00ff88" stroke-width="4" letter-spacing="14" filter="url(#glow-emerald)">SOLUCIONES</text>
</svg>
