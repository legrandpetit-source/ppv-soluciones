# ==============================================================================
# PPV SOLUCIONES INFORMÁTICAS - NGINX SECURITY & PERFORMANCE CONFIGURATION
# Dominio: ppvsoluciones.cl
# ==============================================================================

# Ocultar versión de Nginx
server_tokens off;

# Cabeceras de Seguridad Avanzada (OWASP & Hardening)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'self';" always;

# Compresión Gzip de Alto Rendimiento
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# Manejo de Rutas y Fallback
location / {
    try_files $uri $uri/ /index.html;
    expires 1h;
    add_header Cache-Control "public, no-transform";
}

# Caché Agresivo para Assets Estáticos
location ~* \.(ico|css|js|gif|jpe?g|png|webp|woff2?|svg)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

# Denegar acceso a archivos ocultos (.git, .env)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
